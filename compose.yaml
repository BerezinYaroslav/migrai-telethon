services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-migrai}
      POSTGRES_USER: ${POSTGRES_USER:-migrai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migrai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - migrai_postgres_data:/var/lib/postgresql/data

volumes:
  migrai_postgres_data:
