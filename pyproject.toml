[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "migrai-telethon"
version = "0.1.0"
description = "Read-only Telegram research collector for MIGR.AI CustDev"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.34,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "telethon>=1.42,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
]

[project.scripts]
migrai = "migrai_telethon.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["migrai_telethon"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "googleapiclient", "googleapiclient.*"]
ignore_missing_imports = true
